<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="foodilyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DA870" />
      <stop offset="100%" stop-color="#657C4E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Rounded Circle -->
  <rect width="64" height="64" rx="18" fill="url(#foodilyGrad)" />

  <!-- Inner Soft Accent -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Sprout Stem & Leaves (Foodily Signature) -->
  <g transform="translate(14, 12)" filter="url(#shadow)">
    <!-- Right Leaf -->
    <path d="M18 17 C18 8 28 6 30 6 C30 16 22 20 18 20" fill="#FCFBF7" />
    <!-- Left Leaf -->
    <path d="M18 20 C18 12 8 11 6 11 C6 21 14 23 18 23" fill="#E6EFE3" />
    <!-- Center Stem -->
    <path d="M18 18 Q18 28 18 34" stroke="#FCFBF7" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bowl / Plate Base -->
  <path d="M20 44 C20 51 44 51 44 44 Z" fill="#FCFBF7" />
  <line x1="17" y1="44" x2="47" y2="44" stroke="#FCFBF7" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Coral Accent Berry -->
  <circle cx="45" cy="18" r="4.5" fill="#D75B46" />
</svg>
